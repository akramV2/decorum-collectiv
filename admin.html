<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Rédaction — Decorum Collectiv</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Suez+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- DOMPurify -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="logo.png" alt="Decorum Logo" class="logo-img">
        <span class="brand-name">DECORUM (RÉDACTION)</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">← Retour au site</a>
      </nav>
    </div>
  </header>

  <!-- ÉCRAN DE CONNEXION FIREBASE AUTH -->
  <div id="admin-lock" class="container admin-container">
    <h1 class="admin-title">Accès Sécurisé Rédaction</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Connectez-vous avec vos identifiants administrateur Firebase.</p>
    <form id="login-form" class="admin-form">
      <div class="form-group">
        <label for="admin-email">Adresse e-mail admin</label>
        <input type="email" id="admin-email" placeholder="admin@decorum.fr" required autofocus>
      </div>
      <div class="form-group">
        <label for="admin-password">Mot de passe</label>
        <input type="password" id="admin-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">SE CONNECTER</button>
    </form>
  </div>

  <!-- FORMULAIRE DE RÉDACTION ET GESTION -->
  <main id="admin-content" class="container admin-container" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h1 class="admin-title" style="margin-bottom:0;">Nouvelle Publication</h1>
      <button onclick="logoutAdmin()" style="background:none; border:none; color:var(--rust); cursor:pointer; font-weight:600;">Se déconnecter</button>
    </div>

    <form id="add-article-form" class="admin-form">
      <div class="form-row">
        <div class="form-group">
          <label for="pub-type">Type de publication *</label>
          <select id="pub-type" class="admin-select" required>
            <option value="ARTICLE DE JOURNAL">Article de journal</option>
            <option value="INTERVIEW">Interview / Rencontre</option>
            <option value="PHOTOGRAPHIE & ŒUVRE">Photographie / Œuvre</option>
            <option value="ESSAI SPATIAL">Essai Spatial</option>
            <option value="DOSSIER ARCHITECTURE">Dossier Architecture</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Thématique / Mots-clés *</label>
          <input type="text" id="category" placeholder="ex: BRUTALISME, VILLA CAVROIS, BÉTON" required>
        </div>
      </div>

      <div class="form-group">
        <label for="title">Titre de la publication *</label>
        <input type="text" id="title" placeholder="ex: La Villa Cavrois : Rigueur et Poétique de Mallet-Stevens" required>
      </div>

      <div class="form-group">
        <label for="author">Auteur / Photographe *</label>
        <input type="text" id="author" value="Raphaël" placeholder="ex: Raphaël" required>
      </div>

      <!-- TÉLÉVERSEMENT PHOTO DIRECT -->
      <div class="form-group">
        <label for="image-url">Photo Principale (Lien ou Import Direct)</label>
        <div class="upload-box">
          <input type="url" id="image-url" placeholder="https://images.unsplash.com/photo-..." style="flex:1;">
          <label class="btn-file">
             Choisir un fichier
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="uploadImageDirect(this)">
          </label>
        </div>
        <span id="upload-status" style="font-size: 0.8rem; color: var(--rust); font-weight: 600;"></span>
      </div>

      <div class="form-group">
        <label for="excerpt">Accroche / Résumé (Chapeau) *</label>
        <textarea id="excerpt" rows="2" placeholder="Une courte description d'accroche..." required></textarea>
      </div>

      <div class="form-group">
        <label for="content">Contenu principal *</label>
        <textarea id="content" rows="12" placeholder="Rédige ton texte complet ici. Tu peux sauter des lignes pour créer des paragraphes..." required></textarea>
      </div>

      <div class="admin-actions-bar">
        <button type="button" class="btn-preview" onclick="openPreviewModal()"> APERÇU DE L'ARTICLE</button>
        <button type="submit" class="btn-submit" style="margin-top:0;">PUBLIER EN LIGNE</button>
      </div>
    </form>

    <!-- SECTION GESTION & SUPPRESSION DES ARTICLES -->
    <section class="admin-manage-section" style="margin-top: 60px; padding-top: 40px; border-top: 1px solid rgba(0,0,0,0.12);">
      <h2 style="font-family: 'Suez One', serif; font-size: 1.4rem; margin-bottom: 20px;">Gérer & supprimer des articles</h2>
      <div id="admin-articles-list">
        <p style="color: var(--text-muted);">Chargement des publications...</p>
      </div>
    </section>
  </main>

  <!-- MODALE D'APERÇU -->
  <div id="preview-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closePreviewModal()">&times;</button>
      <header class="article-header">
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
          <span class="tag-type" id="prev-type">TYPE</span>
          <span class="tag" id="prev-category" style="position:static;">CATÉGORIE</span>
        </div>
        <h1 class="article-main-title" id="prev-title">Titre de l'article</h1>
        <div class="article-meta-bar">
          <span id="prev-author">Par Raphaël</span> — <time>Aujourd'hui</time>
        </div>
      </header>
      <div id="prev-image" class="article-hero-image"></div>
      <p class="article-lead" id="prev-excerpt"></p>
      <div class="article-body" id="prev-content"></div>
      <button type="button" class="btn-submit" style="width: 100%; margin-top: 30px;" onclick="submitFormFromPreview()">CONFIRMER & PUBLIER EN LIGNE</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Écoute de l'état de connexion Firebase Auth
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('admin-lock').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        renderAdminArticlesList();
      } else {
        document.getElementById('admin-lock').style.display = 'block';
        document.getElementById('admin-content').style.display = 'none';
      }
    });

    // Connexion
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const pwd = document.getElementById('admin-password').value;

      try {
        await firebase.auth().signInWithEmailAndPassword(email, pwd);
        showNotification('Connexion réussie.');
      } catch (error) {
        console.error("Erreur Firebase Auth :", error);
        showNotification('Identifiants incorrects.');
      }
    });

    // Déconnexion
    async function logoutAdmin() {
      try {
        await firebase.auth().signOut();
        showNotification('Déconnexion réussie.');
      } catch (error) {
        console.error("Erreur déconnexion :", error);
      }
    }

    // Soumission du formulaire
    document.getElementById('add-article-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      await executePublishing();
    });

    async function executePublishing() {
      const newArticle = {
        title: document.getElementById('title').value,
        type: document.getElementById('pub-type').value,
        category: document.getElementById('category').value.toUpperCase(),
        author: document.getElementById('author').value,
        image: document.getElementById('image-url').value,
        excerpt: document.getElementById('excerpt').value,
        content: document.getElementById('content').value,
        likes: 0,
        date: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await saveNewArticle(newArticle);
      sessionStorage.setItem('decorum_toast', 'Publication mise en ligne avec succès !');
      window.location.href = 'index.html';
    }

    function submitFormFromPreview() {
      closePreviewModal();
      executePublishing();
    }
  </script>
</body>
</html>
