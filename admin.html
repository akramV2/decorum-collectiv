<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Decorum Collectiv</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Suez+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="logo.png" alt="Decorum Logo" class="logo-img">
        <span class="brand-name">DECORUM (ADMIN)</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">← Retour au site</a>
      </nav>
    </div>
  </header>

  <!-- ECRAN DE VERROUILLAGE MOT DE PASSE -->
  <div id="admin-lock" class="container admin-container">
    <h1 class="admin-title">Accès Rédaction</h1>
    <form id="login-form" class="admin-form">
      <div class="form-group">
        <label for="admin-password">Mot de passe requis</label>
        <input type="password" id="admin-password" placeholder="Entrez le mot de passe secret..." required>
      </div>
      <button type="submit" class="btn-submit">DEVERROUILLER</button>
    </form>
  </div>

  <!-- FORMULAIRE DE REDACTION (MASQUE PAR DEFAUT) -->
  <main id="admin-content" class="container admin-container" style="display: none;">
    <h1 class="admin-title">Publier un nouvel article</h1>

    <form id="add-article-form" class="admin-form">
      <div class="form-group">
        <label for="title">Titre de l'article *</label>
        <input type="text" id="title" placeholder="ex: Tadao Andō : La Poétique du Béton" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">Catégorie *</label>
          <input type="text" id="category" placeholder="ex: ESSAI SPATIAL" required>
        </div>

        <div class="form-group">
          <label for="author">Auteur *</label>
          <input type="text" id="author" placeholder="ex: La Rédaction" required>
        </div>
      </div>

      <div class="form-group">
        <label for="image-url">Lien de l'image (URL) - optionnel</label>
        <input type="url" id="image-url" placeholder="https://images.unsplash.com/...">
      </div>

      <div class="form-group">
        <label for="excerpt">Résumé rapide (Chapeau) *</label>
        <textarea id="excerpt" rows="2" placeholder="Un court résumé..." required></textarea>
      </div>

      <div class="form-group">
        <label for="content">Contenu de l'article *</label>
        <textarea id="content" rows="10" placeholder="Écris ton article complet ici..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">PUBLIER DANS LE CLOUD</button>
    </form>
  </main>

  <script src="script.js"></script>
  <script>
    // DEFIMIR TON MOT DE PASSE SECRET ICI
    const SECRET_PASSWORD = "decorum2026"; 

    // Vérification de la session
    if (sessionStorage.getItem('decorum_admin_auth') === 'true') {
      document.getElementById('admin-lock').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const pwd = document.getElementById('admin-password').value;
      if (pwd === SECRET_PASSWORD) {
        sessionStorage.setItem('decorum_admin_auth', 'true');
        document.getElementById('admin-lock').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        showNotification('Accès autorisé.');
      } else {
        showNotification('Mot de passe incorrect.');
      }
    });

    document.getElementById('add-article-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const newArticle = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value.toUpperCase(),
        author: document.getElementById('author').value,
        image: document.getElementById('image-url').value,
        excerpt: document.getElementById('excerpt').value,
        content: document.getElementById('content').value,
        date: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await saveNewArticle(newArticle);
      sessionStorage.setItem('decorum_toast', 'Article publié sur la base de données cloud.');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
