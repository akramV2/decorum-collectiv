<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorum Collectiv — Article</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;1,400&family=Suez+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Bouton Like Vectoriel Minimaliste */
    .btn-like-minimal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 20px;
      padding: 8px 18px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-like-minimal:hover {
      border-color: #111;
      color: #111;
    }

    .btn-like-minimal.liked {
      border-color: #c0392b;
      color: #c0392b;
    }

    .btn-like-minimal svg {
      transition: transform 0.2s ease, fill 0.2s ease;
    }

    .btn-like-minimal:active svg {
      transform: scale(1.25);
    }
  </style>
</head>
<body>

  <!-- BARRE DE PROGRESSION LECTURE -->
  <div id="read-progress" class="read-progress-bar"></div>

  <!-- HEADER -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" title="Accueil (5 clics pour accès rédaction)">
        <img src="logo.png" alt="Decorum Logo" class="logo-img">
        <span class="brand-name">DECORUM</span>
      </a>
      <nav class="nav-links">
        <a href="index.html#journal">Journal</a>
        <a href="index.html#carte">Carte</a>
        <a href="manifesto.html">Manifesto</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="menu-btn" type="button">MENU</button>
    </div>
  </header>

  <!-- CONTENU DE L'ARTICLE -->
  <article class="article-page container">
    <header class="article-header">
      <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;">
        <span class="tag-type" id="art-type">FORMAT</span>
        <span class="tag" id="art-category" style="position:static;">CATÉGORIE</span>
        <span class="read-time-badge" id="art-read-time">calcul en cours...</span>
      </div>
      <h1 class="article-main-title" id="art-title">Titre de l'article</h1>
      <div class="article-meta-bar">
        <span id="art-author">Par Auteur</span> — <time id="art-date">DATE</time>
      </div>
    </header>

    <div id="art-image-wrapper" class="article-hero-image"></div>

    <p class="article-lead" id="art-excerpt"></p>

    <div class="article-body" id="art-content"></div>

    <!-- BOUTON LIKE MINIMALISTE -->
    <div class="article-like-section" style="margin-top: 60px; padding-top: 30px; border-top: 1px solid rgba(0,0,0,0.08); text-align: center;">
      <button id="like-btn" onclick="toggleLikeArticle()" class="btn-like-minimal" aria-label="J'aime">
        <svg id="like-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span id="like-count">0</span>
      </button>
    </div>

    <div class="article-actions" id="admin-actions" style="display: none;">
      <button onclick="deleteCurrentArticle()" class="btn-delete">Supprimer cet article (Admin)</button>
    </div>
  </article>

  <script src="script.js"></script>
  <script>
    renderSingleArticle();
    if (sessionStorage.getItem('decorum_admin_auth') === 'true') {
      const actions = document.getElementById('admin-actions');
      if (actions) actions.style.display = 'block';
    }
  </script>
</body>
</html>
