<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorum Collectiv — Article</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;1,400&family=Suez+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" title="Accueil (5 clics pour accès rédaction)">
        <img src="logo.png" alt="Decorum Logo" class="logo-img">
        <span class="brand-name">DECORUM</span>
      </a>
      <nav class="nav-links">
        <a href="index.html#journal">Journal</a>
        <a href="manifesto.html">Manifesto</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="menu-btn" type="button">MENU</button>
    </div>
  </header>

  <!-- CONTENU DE L'ARTICLE -->
  <article class="article-page container">
    <header class="article-header">
      <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;">
        <span class="tag-type" id="art-type">FORMAT</span>
        <span class="tag" id="art-category">CATÉGORIE</span>
      </div>
      <h1 class="article-main-title" id="art-title">Titre de l'article</h1>
      <div class="article-meta-bar">
        <span id="art-author">Par Auteur</span> — <time id="art-date">DATE</time>
      </div>
    </header>

    <div id="art-image-wrapper" class="article-hero-image"></div>

    <p class="article-lead" id="art-excerpt"></p>

    <div class="article-body" id="art-content"></div>

    <div class="article-actions" id="admin-actions" style="display: none;">
      <button onclick="deleteCurrentArticle()" class="btn-delete">Supprimer cet article (Admin)</button>
    </div>
  </article>

  <script src="script.js"></script>
  <script>
    renderSingleArticle();
    if (sessionStorage.getItem('decorum_admin_auth') === 'true') {
      const actions = document.getElementById('admin-actions');
      if (actions) actions.style.display = 'block';
    }
  </script>
</body>
</html>
