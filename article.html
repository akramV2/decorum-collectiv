<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorum Collectiv — Article</title>

  <meta name="theme-color" content="#2A38F5">
  <meta name="apple-mobile-web-app-title" content="DECORUM">
  <meta name="application-name" content="DECORUM">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="editorial.css">
  <script src="editorial.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" defer></script>

  <!-- DOMPurify (Protection XSS) -->
  <script src="assets/vendor/purify-3.4.16.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- BARRE DE PROGRESSION LECTURE -->
  <div id="read-progress" class="read-progress-bar"></div>

  <!-- HEADER -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" title="Accueil (5 clics pour accès rédaction)">
        <svg class="logo-d-icon" width="36" height="36" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="250" height="500" fill="#2A38F5" />
          <path d="M250 0 C388.071 0 500 111.929 500 250 C500 388.071 388.071 500 250 500 V0Z" fill="#FF5A3C" />
        </svg>
        <span class="brand-name">DECORUM</span>
      </a>
      <nav class="nav-links">
        <a href="index.html#journal">Journal</a>
        <a href="index.html#carte">Carte</a>
        <a href="index.html#manifesto">Manifesto</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="menu-btn" type="button">MENU</button>
    </div>
  </header>

  <!-- CONTENU DE L'ARTICLE -->
  <article class="article-page container">
    <header class="article-header">
      <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;">
        <span class="tag-type" id="art-type">FORMAT</span>
        <span class="tag" id="art-category" style="position:static;">CATÉGORIE</span>
        <span class="read-time-badge" id="art-read-time">calcul en cours...</span>
      </div>
      <h1 class="article-main-title" id="art-title">Titre de l'article</h1>
      <div class="article-meta-bar">
        <span id="art-author">Par Auteur</span> — <time id="art-date">DATE</time>
      </div>
    </header>

    <div id="art-image-wrapper" class="article-hero-image"></div>

    <p class="article-lead" id="art-excerpt"></p>

    <div class="article-body" id="art-content"></div>
    <div id="reader-actions" class="reader-actions" hidden><a href="#">Télécharger l’article — PDF à emporter ↓</a></div>

    <!-- BOUTON LIKE MINIMALISTE -->
    <div class="like-container">
  <button id="like-btn" class="like-button" onclick="toggleLikeArticle()" aria-label="J'aime cet article">
    <svg class="heart-icon" viewBox="0 0 24 24" width="20" height="20">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <span id="like-count">0</span>
  </button>
</div>

    <!-- ACTIONS ADMIN (SUPPRESSION DIRECTE) -->
    <div class="article-actions" id="admin-actions" style="display: none; margin-top: 30px; text-align: center;">
  <button onclick="deleteCurrentArticle()" class="btn-delete" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600;">Supprimer cet article</button>
</div>
  </article>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().onAuthStateChanged((user) => {
          const actions = document.getElementById('admin-actions');
          if (actions) {
            actions.style.display = 'none'; // Editing and withdrawal are managed in the protected newsroom.
          }
        });
      }
    });

    async function deleteCurrentArticle() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      if (confirm("Voulez-vous vraiment supprimer cet article définitivement ?")) {
        try {
          await db.collection('articles').doc(id).delete();
          sessionStorage.setItem('decorum_toast', 'Article supprimé avec succès.');
          window.location.href = 'index.html';
        } catch (error) {
          console.error("Erreur de suppression :", error);
          if (typeof showNotification === 'function') showNotification("Erreur lors de la suppression.");
        }
      }
    }
  </script>
</body>
</html>
